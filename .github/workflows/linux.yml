name: Linux

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build
        run: |
          make clean
          CXX=g++ make

      - name: Run
        run: |
          CXX=g++ make run

      - name: Upload Linux library
        uses: actions/upload-artifact@v4
        with:
          name: libjsonparser-linux
          path: shared/libjsonparser.so